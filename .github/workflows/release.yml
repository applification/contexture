name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: contexture-stable-release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - name: Verify CLI and desktop versions match the stable release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const tag = (process.env.TAG_NAME || "").replace(/^v/, "");
          const version = JSON.parse(
            fs.readFileSync("apps/desktop/package.json", "utf8"),
          ).version;
          const cliVersion = JSON.parse(
            fs.readFileSync("packages/cli/package.json", "utf8"),
          ).version;

          if (!/^\d+\.\d+\.\d+$/.test(tag) || version !== tag || cliVersion !== tag) {
            console.error(
              `Release tag ${process.env.TAG_NAME}, desktop ${version}, and CLI ${cliVersion} must match.`,
            );
            process.exit(1);
          }

          console.log(`Release version ${version} matches ${process.env.TAG_NAME}.`);
          NODE
      - name: Create or resume a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --json isDraft > release-state.json; then
            node -e 'if (!require("./release-state.json").isDraft) throw new Error("Refusing to modify a published release")'
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --draft \
              --latest=false \
              --title "$TAG_NAME" \
              --generate-notes
          fi

  cli-package:
    needs: create-release
    uses: ./.github/workflows/cli-package.yml

  upload-cli:
    needs: cli-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexture-cli
          path: artifact
      - name: Attach the verified package and checksum to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG_NAME" artifact/*.tgz artifact/*.sha256 --clobber

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: windows-2022
            platform: win
          - os: ubuntu-24.04
            platform: linux

    runs-on: ${{ matrix.os }}
    env:
      EP_DRAFT: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load desktop env (varlock)
        uses: dmno-dev/varlock-action@v1.0.1
        with:
          working-directory: apps/desktop
        env:
          INFISICAL_ENV: prod
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Build
        run: bun run build --filter=@contexture/desktop

      - name: Package and publish (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bunx electron-builder --mac --publish always
        working-directory: apps/desktop

      - name: Package and publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bunx electron-builder --win --publish always
        working-directory: apps/desktop

      - name: Package and publish (Linux)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bunx electron-builder --linux --publish always
        working-directory: apps/desktop

  verify-release-assets:
    needs: [build, upload-cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexture-cli
          path: verified-cli
      - name: Verify all downloaded release assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = true
          gh release download "$TAG_NAME" --dir release-assets
          bun packages/cli/scripts/verify-release.ts "$TAG_NAME" release-assets verified-cli

  publish-npm:
    needs: verify-release-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.16.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexture-cli
          path: artifact
      - name: Publish the tested tarball with npm trusted publishing
        run: node artifact/npm-release.js publish artifact

  npm-consumer:
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexture-cli
          path: artifact
      - run: npm install --prefix "${{ runner.temp }}/contexture-pnpm" --ignore-scripts pnpm@10.32.1
      - name: Verify the published package in a clean consumer
        run: node artifact/verify-package.ts artifact "${{ runner.temp }}/contexture-pnpm/node_modules/pnpm/bin/pnpm.cjs" npm

  publish-release:
    needs: npm-consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexture-cli
          path: artifact
      - name: Complete the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = true
          node artifact/npm-release.js verify artifact
          gh release edit "$TAG_NAME" --draft=false --latest
