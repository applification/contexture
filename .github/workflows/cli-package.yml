name: CLI package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd packages/cli typecheck
      - run: bun run --cwd packages/cli test
      - name: Build and pack the tagged source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            bun run --cwd packages/cli pack:release "$REF_NAME"
          else
            bun run --cwd packages/cli pack:release
          fi
      - name: Upload candidate package for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contexture-cli
          path: packages/cli/dist/release/
          if-no-files-found: error

  consumer:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      # Deliberately no checkout and no Bun installation: consume only the artifact.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexture-cli
          path: artifact
      - name: Install the test package manager
        run: npm install --prefix "${{ runner.temp }}/contexture-pnpm" --ignore-scripts pnpm@10.32.1
      - name: Verify registry installation with lifecycle scripts disabled
        run: node artifact/verify-package.ts artifact "${{ runner.temp }}/contexture-pnpm/node_modules/pnpm/bin/pnpm.cjs"
      - name: Verify the GitHub tarball installation path
        run: node artifact/verify-package.ts artifact "${{ runner.temp }}/contexture-pnpm/node_modules/pnpm/bin/pnpm.cjs" tarball
